# Fresh Portainer installs with an app-private PostgreSQL service.
# Keep POSTGRES_PASSWORD in Portainer's stack environment; do not commit it.
services:
  postgres:
    image: postgres:18
    container_name: tgstrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tgstrm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
      TGSTRM_DATABASE_PASSWORD: ${TGSTRM_DATABASE_PASSWORD:?Set TGSTRM_DATABASE_PASSWORD in Portainer}
    volumes:
      # PostgreSQL 18's official image stores versioned data below this path.
      - postgres_data:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-tgstrm-app-user.sh:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  tgstrm:
    image: ${TGSTRM_IMAGE:-ghcr.io/REPLACE_WITH_GITHUB_OWNER/tgstrm:latest}
    container_name: tgstrm
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TGSTRM_ADDR: :5151
      TGSTRM_ALLOW_REMOTE: "1"
      TGSTRM_DATA_DIR: /data
      TGSTRM_DATABASE_SETUP_MODE: container
      TGSTRM_TRUSTED_PROXY_CIDRS: ${TGSTRM_TRUSTED_PROXY_CIDRS:-}
    volumes:
      - ${TGSTRM_DATA_DIR_HOST:-/instalaciones/tgstrm/data}:/data
      - ${TGSTRM_MOVIES_DIR_HOST:-/extraible2/strm/movies}:/media/movies
      - ${TGSTRM_SHOWS_DIR_HOST:-/extraible2/strm/series}:/media/shows
    ports:
      - ${TGSTRM_BIND_ADDRESS:-127.0.0.1}:${TGSTRM_PORT:-5151}:5151
    networks: [database, egress]
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "/tgstrm", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

networks:
  database:
    internal: true
  egress:
    driver: bridge

volumes:
  postgres_data:

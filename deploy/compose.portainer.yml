services:
  tgstrm:
    image: ${TGSTRM_IMAGE:-ghcr.io/REPLACE_WITH_GITHUB_OWNER/tgstrm:latest}
    container_name: tgstrm
    restart: unless-stopped
    # The host directories must be writable by this account. Change these two
    # values in Portainer when the installation owner uses another UID/GID.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TGSTRM_ADDR: :5151
      TGSTRM_ALLOW_REMOTE: "1"
      TGSTRM_DATA_DIR: /data
      # Set this to the subnet of the Nginx Proxy Manager Docker network.
      # Leave it empty only when HTTPS terminates directly in TgStrm.
      TGSTRM_TRUSTED_PROXY_CIDRS: ${TGSTRM_TRUSTED_PROXY_CIDRS:-}
    volumes:
      # Persistent TgStrm state: encrypted DB connection, Telegram session,
      # cache and backups. This must survive image updates and recreation.
      - ${TGSTRM_DATA_DIR_HOST:-/instalaciones/tgstrm/data}:/data
      # External libraries: paths selected in the web settings must be these
      # container paths, never the host paths on the left side of the mapping.
      - ${TGSTRM_MOVIES_DIR_HOST:-/extraible2/strm/movies}:/media/movies
      - ${TGSTRM_SHOWS_DIR_HOST:-/extraible2/strm/series}:/media/shows
    ports:
      # Safer default for a host-based Nginx Proxy Manager. If NPM runs in a
      # separate container, connect both services to a private shared network
      # instead of exposing this to the LAN.
      - ${TGSTRM_BIND_ADDRESS:-127.0.0.1}:${TGSTRM_PORT:-5151}:5151
    healthcheck:
      test: ["CMD", "/tgstrm", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

# Advanced variant: use only when Nginx Proxy Manager is also a Docker service. Both
# containers join the same private network; configure NPM upstream as
# http://tgstrm:5151 with WebSocket support enabled.
services:
  tgstrm:
    image: ${TGSTRM_IMAGE:-ghcr.io/anubisreal/tgstrm:latest}
    container_name: tgstrm
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TGSTRM_ADDR: :5151
      TGSTRM_ALLOW_REMOTE: "1"
      TGSTRM_DATA_DIR: /data
      TGSTRM_DATABASE_SETUP_MODE: external
      TGSTRM_TRUSTED_PROXY_CIDRS: ${TGSTRM_TRUSTED_PROXY_CIDRS:-}
    volumes:
      - ${TGSTRM_DATA_DIR_HOST:-/instalaciones/tgstrm/data}:/data
      - ${TGSTRM_MOVIES_DIR_HOST:-/extraible2/strm/movies}:/media/movies
      - ${TGSTRM_SHOWS_DIR_HOST:-/extraible2/strm/series}:/media/shows
    networks: [npm]
    healthcheck:
      test: ["CMD", "/tgstrm", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

networks:
  npm:
    external: true
    name: ${TGSTRM_NPM_NETWORK:-npm_default}

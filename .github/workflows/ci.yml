name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: tgstrm_test
          POSTGRES_PASSWORD: tgstrm-ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tgstrm_test -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify Go
        env:
          TGSTRM_TEST_PG_PASSWORD: tgstrm-ci-test-password
          TGSTRM_TEST_PG_PORT: "5432"
        run: |
          go mod download
          go vet ./...
          go test ./...
          go test -race ./...
      - name: Build web interface
        working-directory: web
        run: |
          npm ci
          node --test tests/*.test.mjs
          npm run build
      - name: Bundle production executable
        run: |
          sh scripts/prepare-web-assets.sh
          CGO_ENABLED=0 go build -trimpath -o bin/tgstrm ./cmd/tgstrm
      - name: Build production image
        run: docker build --build-arg VERSION=ci -t tgstrm:ci .

  platform-smoke:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Test and build natively
        run: |
          go test ./...
          go build ./cmd/tgstrm

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify Go
        run: |
          go mod download
          go vet ./...
          go test ./...
          go test -race ./...
      - name: Build web interface
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Bundle production executable
        run: |
          sh scripts/prepare-web-assets.sh
          CGO_ENABLED=0 go build -trimpath -o bin/tgstrm ./cmd/tgstrm
      - name: Build production image
        run: docker build --build-arg VERSION=ci -t tgstrm:ci .

  platform-smoke:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Test and build natively
        run: |
          go test ./...
          go build ./cmd/tgstrm
